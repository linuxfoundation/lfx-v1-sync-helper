openapi: 3.0.3
info:
    title: LFX V1 Mapping API
    description: Read existing legacy project and committee IDs for V2 resources.
    version: 0.0.1
servers:
    - url: http://localhost:80
      description: Default server for v1-mapping
paths:
    /v1-sync-helper/mappings/{resource_type}/{uid}:
        get:
            tags:
                - mapping
            summary: lookup mapping
            operationId: mapping#lookup
            parameters:
                - name: resource_type
                  in: path
                  required: true
                  schema:
                    type: string
                    example: committee
                    enum:
                        - project
                        - committee
                  example: committee
                - name: uid
                  in: path
                  description: V2 resource UUID
                  required: true
                  schema:
                    type: string
                    description: V2 resource UUID
                    example: 00000000-0000-4000-8000-000000000001
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  example: 00000000-0000-4000-8000-000000000001
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LookupResponseBody'
                            example:
                                committee_sfid: 00000000-0000-4000-8000-000000000002
                                project_sfid: a09000000000001AAA
                                resource_type: committee
                                uid: 00000000-0000-4000-8000-000000000001
                "400":
                    description: 'BadRequest: Bad Request response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: 'Unauthorized: Unauthorized response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'NotFound: Not Found response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "410":
                    description: 'Gone: Mapping has a retained deletion marker'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "502":
                    description: 'BadGateway: Bad Gateway response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "503":
                    description: 'ServiceUnavailable: Service Unavailable response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "504":
                    description: 'GatewayTimeout: Gateway Timeout response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
            security:
                - jwt_header_Authorization: []
components:
    schemas:
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: true
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: false
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: true
            example:
                fault: true
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: true
                timeout: true
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        LookupResponseBody:
            type: object
            properties:
                committee_sfid:
                    type: string
                    description: Legacy committee ID (a UUID); present only for committees
                    example: 00000000-0000-4000-8000-000000000002
                project_sfid:
                    type: string
                    description: Legacy project Salesforce ID
                    example: a09000000000001AAA
                    pattern: ^(?:[a-zA-Z0-9]{15}|[a-zA-Z0-9]{18})$
                resource_type:
                    type: string
                    example: committee
                    enum:
                        - project
                        - committee
                uid:
                    type: string
                    description: Requested V2 resource UUID
                    example: 00000000-0000-4000-8000-000000000001
            example:
                committee_sfid: 00000000-0000-4000-8000-000000000002
                project_sfid: a09000000000001AAA
                resource_type: committee
                uid: 00000000-0000-4000-8000-000000000001
            required:
                - resource_type
                - uid
                - project_sfid
    securitySchemes:
        jwt_header_Authorization:
            type: http
            description: Heimdall JWT issued after the mapping-access team membership check.
            scheme: bearer
            bearerFormat: JWT
tags:
    - name: mapping
