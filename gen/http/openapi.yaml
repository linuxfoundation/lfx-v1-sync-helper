swagger: "2.0"
info:
    title: LFX V1 Mapping API
    description: Read existing legacy project and committee IDs for V2 resources.
    version: 0.0.1
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /v1-sync-helper/mappings/{resource_type}/{uid}:
        get:
            tags:
                - mapping
            summary: lookup mapping
            operationId: mapping#lookup
            parameters:
                - name: resource_type
                  in: path
                  required: true
                  type: string
                  enum:
                    - project
                    - committee
                - name: uid
                  in: path
                  description: V2 resource UUID
                  required: true
                  type: string
                  pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/MappingLookupResponseBody'
                        required:
                            - resource_type
                            - uid
                            - project_sfid
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/MappingLookupBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/MappingLookupUnauthorizedResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/MappingLookupNotFoundResponseBody'
                "410":
                    description: Gone response.
                    schema:
                        $ref: '#/definitions/MappingLookupGoneResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/definitions/MappingLookupBadGatewayResponseBody'
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/MappingLookupServiceUnavailableResponseBody'
                "504":
                    description: Gateway Timeout response.
                    schema:
                        $ref: '#/definitions/MappingLookupGatewayTimeoutResponseBody'
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
