#
# LFXV2-1507: Experimental base-image override so branch images include a
# shell. Batch --sync-user Jobs run many users per container via an sh loop
# instead of one Job per user. The busybox base keeps the ko entrypoint at
# /ko-app/lfx-v1-sync-helper; pods override command with sh -c.
#
# NOT for release: revert before merging to main (releases stay on the
# default shell-less static base).
defaultBaseImage: cgr.dev/chainguard/busybox:latest
