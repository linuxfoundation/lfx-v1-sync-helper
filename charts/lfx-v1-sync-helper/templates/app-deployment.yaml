---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ if hasKey .Values.app "replicas" }}{{ .Values.app.replicas }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: app
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ .Chart.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
        component: app
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default .Chart.Name }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          securityContext:
            allowPrivilegeEscalation: false
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          env:
          {{- range $name, $config := .Values.app.environment }}
          - name: {{ $name }}
            {{- if $config.value }}
            value: {{ $config.value | quote }}
            {{- else if $config.valueFrom }}
            valueFrom:
              {{- toYaml $config.valueFrom | nindent 14 }}
            {{- end }}
          {{- end }}
          # JWT configuration from Heimdall
          - name: HEIMDALL_CLIENT_ID
            value: {{ .Values.app.heimdall.clientId | quote }}
          - name: HEIMDALL_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.app.heimdall.secret.name }}
                key: {{ .Values.app.heimdall.secret.privateKeyKey }}
          # Auth0 configuration for v1 API authentication
          - name: AUTH0_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.app.auth0.secret.name }}
                key: {{ .Values.app.auth0.secret.clientIdKey }}
          - name: AUTH0_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.app.auth0.secret.name }}
                key: {{ .Values.app.auth0.secret.privateKeyKey }}
          # v1 platform database connection for live user lookups
          - name: V1_DB_HOST
            valueFrom:
              secretKeyRef:
                name: {{ .Values.app.database.secret.name }}
                key: {{ .Values.app.database.secret.hostKey }}
          - name: V1_DB_PORT
            value: {{ .Values.app.database.port | quote }}
          - name: V1_DB_NAME
            value: {{ .Values.app.database.name | quote }}
          - name: V1_DB_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Values.app.database.secret.name }}
                key: {{ .Values.app.database.secret.usernameKey }}
          - name: V1_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.app.database.secret.name }}
                key: {{ .Values.app.database.secret.passwordKey }}
          - name: V1_DB_SSLMODE
            value: {{ .Values.app.database.sslMode | quote }}
          # Allow list file paths from ConfigMap mount
          - name: PROJECT_ALLOWLIST_FILE
            value: {{ .Values.allowlist.configMap.mountPath }}/project_allowlist
          - name: PROJECT_FAMILY_ALLOWLIST_FILE
            value: {{ .Values.allowlist.configMap.mountPath }}/project_family_allowlist
          ports:
            - containerPort: 8080
              name: web
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: web
            failureThreshold: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            failureThreshold: 1
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: web
            failureThreshold: 30
            periodSeconds: 1
          volumeMounts:
            - name: allowlists
              mountPath: {{ .Values.allowlist.configMap.mountPath }}
              readOnly: true
      volumes:
        - name: allowlists
          configMap:
            name: {{ .Values.allowlist.configMap.name }}
