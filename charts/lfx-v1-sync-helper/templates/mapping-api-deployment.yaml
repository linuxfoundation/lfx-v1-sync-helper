{{- if .Values.mappingApi.enabled }}
{{- $api := .Values.mappingApi }}
{{- $audience := required "mappingApi.audience is required" $api.audience }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-mapping-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ $api.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: mapping-api
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: mapping-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mapping-api
          image: "{{ $api.image.repository }}:{{ $api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDRESS
              value: ":8080"
            - name: NATS_URL
              value: {{ $api.natsUrl | quote }}
            - name: JWKS_URL
              value: {{ required "mappingApi.jwksUrl is required" $api.jwksUrl | quote }}
            - name: JWT_ISSUER
              value: {{ required "mappingApi.issuer is required" $api.issuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ $audience | quote }}
          resources:
            {{- toYaml $api.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http
{{- end }}
