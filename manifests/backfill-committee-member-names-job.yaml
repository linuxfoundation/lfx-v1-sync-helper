#
# One-shot Job to populate first_name / last_name on V2 committee member records
# that have both fields empty. This affects members who had no LFX account at
# sync time — merged_user had no username for them, so names were silently
# dropped from the sync payload (linuxfoundation/lfx-self-serve-ops#3).
#
# The job reads each forward mapping (committee_member.sfid.*), skips members
# that already have a name, resolves the contact SFID from the reverse mapping
# (handling old "poisoned" entries via v1-objects), reads first/last name
# directly from salesforce.merged_user, then patches V2 with SkipEnrichment=true
# so the committee service stores the names as-is without another auth-service
# lookup.
#
# Idempotent: records that already have a name are skipped. Safe to re-run.
#
# One-shot: applied manually via kubectl — NOT managed by ArgoCD.
# Run --backfill-committee-member-mappings first to repair poisoned mappings
# before this pass (the names backfill also handles unrepaired entries via
# v1-objects, but cleaner if mappings are repaired first).
#
# Dry run: add "--dry-run" to args before applying. Remove it for the live run.
#
# Deploy with:
#   kubectl --context lfx-v2-prod -n v1-sync-helper apply -f manifests/backfill-committee-member-names-job.yaml
#
# Monitor:
#   kubectl --context lfx-v2-prod -n v1-sync-helper logs -f --timestamps=true job/backfill-committee-member-names
#
# Abort:
#   kubectl --context lfx-v2-prod -n v1-sync-helper delete job backfill-committee-member-names
#
# Auto-cleans after 1h via ttlSecondsAfterFinished.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-committee-member-names
  namespace: v1-sync-helper
  labels:
    app.kubernetes.io/name: lfx-v1-sync-helper
    app.kubernetes.io/component: backfill
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lfx-v1-sync-helper
        app.kubernetes.io/component: backfill
    spec:
      restartPolicy: Never
      serviceAccountName: v1-sync-helper-sa
      containers:
        - name: backfill
          # XXX: Replace with the image SHA for the release you want to run against.
          # Find the current prod image with:
          #   kubectl --context lfx-v2-prod -n v1-sync-helper get deployment \
          #     -o jsonpath='{.items[0].spec.template.spec.containers[0].image}'
          image: ghcr.io/linuxfoundation/lfx-v1-sync-helper/lfx-v1-sync-helper:0.14.6
          imagePullPolicy: IfNotPresent
          args: ["--backfill-committee-member-names", "--dry-run"]
          env:
            # --- actually used by this backfill ---
            - name: NATS_URL
              value: "nats://lfx-platform-nats.lfx.svc.cluster.local:4222"
            - name: COMMITTEE_SERVICE_URL
              value: "http://lfx-v2-committee-service.committee-service.svc.cluster.local:8080"
            - name: HEIMDALL_JWKS_URL
              value: "http://lfx-platform-heimdall.lfx.svc.cluster.local:4457/.well-known/jwks"
            - name: HEIMDALL_KEY_ID
              value: "prod-rsa-2025-12-12-001"
            - name: HEIMDALL_CLIENT_ID
              value: "N36DA2hiUeMHN4XuaSggrJH3ELA2Ss31"
            - name: USE_MSGPACK
              value: "1"
            - name: HEIMDALL_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  key: key.pem
                  name: heimdall-signer-cert-ad-hoc
            # v1 platform database — needed to read merged_user rows for names.
            - name: V1_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: v1-sync-helper-secrets
            - name: V1_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: v1-sync-helper-secrets
            - name: V1_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: v1-sync-helper-secrets
            # --- required by LoadConfig() but not used by this backfill ---
            - name: PROJECT_SERVICE_URL
              value: "http://lfx-v2-project-service.project-service.svc.cluster.local:8080"
            - name: AUTH0_TENANT
              value: "linuxfoundation"
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: v1-sync-helper-secrets
            - name: AUTH0_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  key: client_private_key
                  name: v1-sync-helper-secrets
            # Optional: raise if logs show scan-timeout warnings. Defaults to 2m.
            # - name: NATS_FETCH_MAX_WAIT
            #   value: "2m"
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
