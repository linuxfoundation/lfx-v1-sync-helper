#
# One-shot Job to backfill v1 profile fields (name, title, address, etc.)
# to Auth0 user_metadata.
#
# Iterates Auth0 users (Username-Password-Authentication connection only),
# sorted by updated_at ascending. For each user, resolves the v1 SFID,
# fetches the merged_user record from the v1-objects KV bucket, and calls
# syncProfileToAuth0 (which no-ops when nothing has changed).
# A cursor stored at v1-mappings key "backfill.profiles.cursor" enables
# resumable runs: re-run the job to advance the cursor.
#
# This replaces the legacy PROFILE_SYNC_BACKFILL=true env-var approach.
#
# One-shot: this manifest is applied manually via kubectl apply — it is NOT
# managed by argocd and runs on demand only.
#
# To adjust the batch size, change the --limit arg below (default: 1000 users).
#
# Dry run: to preview without writing, add "--dry-run" to args before applying.
# Remove it for the live run.
#
# Credentials: every valueFrom.secretKeyRef below references a Kubernetes Secret
# already provisioned in the v1-sync-helper namespace. Only secret names are
# committed here. Safe to commit.
#
# Deploy with:
#   kubectl --context lfx-v2-prod -n v1-sync-helper apply -f manifests/backfill-profiles-job.yaml
#
# Monitor:
#   kubectl --context lfx-v2-prod -n v1-sync-helper logs -f --timestamps=true job/backfill-profiles
#
# Abort:
#   kubectl --context lfx-v2-prod -n v1-sync-helper delete job backfill-profiles
#
# Clean up (auto-cleans after 1h via ttlSecondsAfterFinished):
#   kubectl --context lfx-v2-prod -n v1-sync-helper delete job backfill-profiles
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-profiles
  namespace: v1-sync-helper
  labels:
    app.kubernetes.io/name: lfx-v1-sync-helper
    app.kubernetes.io/component: backfill
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lfx-v1-sync-helper
        app.kubernetes.io/component: backfill
    spec:
      restartPolicy: Never
      serviceAccountName: v1-sync-helper-sa
      containers:
        - name: backfill
          # XXX: Replace with the image SHA for the release you want to run against.
          # Find the current prod image with:
          #   kubectl --context lfx-v2-prod -n v1-sync-helper get deployment \
          #     -o jsonpath='{.items[0].spec.template.spec.containers[0].image}'
          image: ghcr.io/linuxfoundation/lfx-v1-sync-helper/lfx-v1-sync-helper:latest
          imagePullPolicy: IfNotPresent
          args: ["--backfill-profiles", "--limit", "1000"]
          env:
            - name: NATS_URL
              value: "nats://lfx-platform-nats.lfx.svc.cluster.local:4222"
            - name: AUTH0_TENANT
              value: "linuxfoundation"
            - name: BIND
              value: "*"
            - name: COMMITTEE_SERVICE_URL
              value: "http://lfx-v2-committee-service.committee-service.svc.cluster.local:8080"
            - name: HEIMDALL_JWKS_URL
              value: "http://lfx-platform-heimdall.lfx.svc.cluster.local:4457/.well-known/jwks"
            - name: HEIMDALL_KEY_ID
              value: "prod-rsa-2025-12-12-001"
            - name: LFX_API_GW
              value: "https://api-gw.platform.linuxfoundation.org/"
            - name: PORT
              value: "8080"
            - name: PROJECT_SERVICE_URL
              value: "http://lfx-v2-project-service.project-service.svc.cluster.local:8080"
            - name: USE_MSGPACK
              value: "1"
            # Before applying: replace this value with the HEIMDALL_CLIENT_ID from the
            # running deployment (it is not stored in a Secret):
            #   kubectl --context lfx-v2-prod -n v1-sync-helper get deployment \
            #     -o jsonpath'{.items[0].spec.template.spec.containers[0].env[?(@.name=="HEIMDALL_CLIENT_ID")].value}'
            - name: HEIMDALL_CLIENT_ID
              value: ""
            - name: HEIMDALL_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  key: key.pem
                  name: heimdall-signer-cert-ad-hoc
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: v1-sync-helper-secrets
            - name: AUTH0_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  key: client_private_key
                  name: v1-sync-helper-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
