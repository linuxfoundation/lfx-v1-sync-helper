#
# One-shot Job to re-emit v1 platform-community__c (committee member) rows that
# have no committee_member.sfid.* mapping but whose committee is mapped
# (lfx-self-serve-ops#2100). handleCommitteeMemberUpdate ACKs every
# committee-service rejection and every member whose committee was unmapped,
# so those members are never retried. Re-PUTs the existing v1-objects value so
# the running deployment's durable KV consumer creates each member in v2.
#
# Most of these members are rejected because their committee requires an
# organization (enable_voting or business_email_required) and the member has
# none, has a non-B2B org without a domain, or its v1 org lookup failed. With
# --relax-committee-settings, each such committee is processed alone:
#   1. its current v2 enable_voting / business_email_required (and the v1
#      values) are recorded in a durable hold,
#      backfill.member_settings.committee.<uid> in v1-mappings;
#   2. the blocking settings are turned off in v2 (fresh read + ETag, service
#      principal, writers/auditors omitted so no email is sent);
#   3. its members are re-emitted and their mappings awaited (--settle-timeout);
#   4. the recorded values are restored, even if a step failed, and re-read.
# While a hold is active (and for 10 minutes after the restore), the
# deployment keeps the relaxed settings out of both sync directions, so
# neither toggle reaches v1 and a v1 edit cannot turn a setting back on early.
# Other settings keep syncing. A v1 edit to a held setting made during the
# hold is not applied to v2; the post-run check reports it as a mismatch.
#
# One live run at a time: a live run holds a heartbeat lock
# (backfill.member_settings.lock) and refuses to start while another run's
# lock is fresh (3m). A re-run first restores every hold an earlier run left
# unrestored (a hold whose committee was deleted from v2 is marked restored
# with restore_note=committee_deleted); it tries every hold and starts no new
# committee if any restore failed.
#
# Mapping store: this Job reads and writes the same v1-mappings backend as the
# deployment (member mappings it waits for, and the holds the deployment's
# guards read). dev and prod run V1_MAPPINGS_STORE_MODE=postgres (lfx-v2-argocd
# values/<env>/lfx-v1-sync-helper.yaml), so the Job sets the same mode and the
# Postgres fields from v1-sync-helper-secrets (database.external, shape:
# fields). Keep the mode equal to the deployment's: a Job in kv mode against a
# postgres deployment would read stale mappings and write holds the
# deployment never sees.
#
# Prerequisites:
#   - The deployment runs a release that includes the settings-hold guards
#     (the same release as this Job's image). An older deployment would sync
#     the toggles to v1.
#   - The deployment has COMMITTEE_SKIP_MEMBER_NOTIFICATIONS unset or true, so
#     the members it creates get no notification email.
#   - V1_MAPPINGS_STORE_MODE below matches the deployment's.
#   - Run off-hours, during an announced freeze on committee edits in v1 and
#     Self Serve.
#
# Run order:
#   1. Dry run (default args). Review the per-committee "committee with
#      unmapped v1 members" lines and the cause_* totals. Members of deleted
#      committees (cause_deleted_committee) are reported, never imported.
#   2. Pilot: replace "--dry-run" with
#      "--relax-committee-settings", "--committee", "<committee sfid>".
#      Check the committee's members in Self Serve and its v1 audit log.
#   3. Live run: "--relax-committee-settings" without --committee. Use
#      "--exclude-project", "<project sfid,...>" to leave projects out.
#   4. Dry run again: the imported members are no longer listed.
#
# After a live run, the summary log has verified / verify_mismatches: every
# touched committee's v2 and v1 settings are compared with the hold. Also
# check the deployment logs for exhausted v2→v1 retries and member failures:
#   kubectl --context lfx-v2-prod -n v1-sync-helper logs deploy/lfx-v1-sync-helper --since=2h \
#     | grep -E 'failed to sync committee member|failed to update committee in v1|settings held by member backfill'
#
# Deploy with:
#   # If the Job already exists (e.g. from a prior dry run), delete it first —
#   # a completed Job's pod template is immutable and re-applying will fail:
#   kubectl --context lfx-v2-prod -n v1-sync-helper delete job backfill-committee-members --ignore-not-found
#   kubectl --context lfx-v2-prod -n v1-sync-helper apply -f manifests/backfill-committee-members-job.yaml
#
# Monitor:
#   kubectl --context lfx-v2-prod -n v1-sync-helper logs -f --timestamps=true job/backfill-committee-members
#
# Abort: deleting the Job sends SIGTERM; the run stops and restores the
# committee it is working on within terminationGracePeriodSeconds. If the pod
# is killed before that, re-apply the Job (live args) after the lock goes
# stale (3m) to restore it.
#   kubectl --context lfx-v2-prod -n v1-sync-helper delete job backfill-committee-members
#
# One-shot: applied manually via kubectl — NOT managed by ArgoCD.
# Auto-cleans after 1h via ttlSecondsAfterFinished.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-committee-members
  namespace: v1-sync-helper
  labels:
    app.kubernetes.io/name: lfx-v1-sync-helper
    app.kubernetes.io/component: backfill
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lfx-v1-sync-helper
        app.kubernetes.io/component: backfill
    spec:
      restartPolicy: Never
      # SIGTERM cancels the run, then the committee in progress is restored
      # on a detached context with a 1m timeout; leave room for it.
      terminationGracePeriodSeconds: 120
      serviceAccountName: v1-sync-helper-sa
      containers:
        - name: backfill
          # XXX: Replace with the image SHA for the release you want to run against.
          # Find the current prod image with:
          #   kubectl --context lfx-v2-prod -n v1-sync-helper get deployment \
          #     -o jsonpath='{.items[0].spec.template.spec.containers[0].image}'
          image: ghcr.io/linuxfoundation/lfx-v1-sync-helper/lfx-v1-sync-helper:latest
          imagePullPolicy: IfNotPresent
          args: ["--backfill-committee-members", "--dry-run"]
          env:
            # --- actually used by this backfill ---
            - name: NATS_URL
              value: "nats://lfx-platform-nats.lfx.svc.cluster.local:4222"
            - name: COMMITTEE_SERVICE_URL
              value: "http://lfx-v2-committee-service.committee-service.svc.cluster.local:8080"
            - name: HEIMDALL_JWKS_URL
              value: "http://lfx-platform-heimdall.lfx.svc.cluster.local:4457/.well-known/jwks"
            - name: HEIMDALL_KEY_ID
              value: "prod-rsa-2025-12-12-001"
            - name: HEIMDALL_CLIENT_ID
              value: "N36DA2hiUeMHN4XuaSggrJH3ELA2Ss31"
            - name: USE_MSGPACK
              value: "1"
            - name: HEIMDALL_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  key: key.pem
                  name: heimdall-signer-cert-ad-hoc
            # shouldSkipSync needs the client ID to recognize v2-authored rows.
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: v1-sync-helper-secrets
            # v1 platform database — reads salesforce.account to classify
            # members whose organization blocks them.
            - name: V1_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-credentials-ad-hoc
            - name: V1_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-credentials-ad-hoc
            - name: V1_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-credentials-ad-hoc
            - name: V1_DB_NAME
              value: "sfdc"
            # --- required by LoadConfig() but not used by this backfill ---
            - name: PROJECT_SERVICE_URL
              value: "http://lfx-v2-project-service.project-service.svc.cluster.local:8080"
            - name: AUTH0_TENANT
              value: "linuxfoundation"
            - name: AUTH0_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  key: client_private_key
                  name: v1-sync-helper-secrets
            # v1-mappings store — must match the deployment (postgres in dev
            # and prod). Same Secret and keys as the chart's database.external
            # "fields" shape.
            - name: V1_MAPPINGS_STORE_MODE
              value: "postgres"
            - name: V1_MAPPINGS_PGHOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: v1-sync-helper-secrets
            - name: V1_MAPPINGS_PGPORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: v1-sync-helper-secrets
            - name: V1_MAPPINGS_PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: v1-sync-helper-secrets
            - name: V1_MAPPINGS_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: v1-sync-helper-secrets
            - name: V1_MAPPINGS_PGDATABASE
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: v1-sync-helper-secrets
            # No LFX_API_GW: this backfill never calls the v1 API.
            # Optional: raise if logs show scan-timeout warnings. Defaults to 2m.
            # - name: NATS_FETCH_MAX_WAIT
            #   value: "2m"
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              # Holds every platform-community__c record and member mapping in
              # memory for the join.
              memory: "2Gi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
