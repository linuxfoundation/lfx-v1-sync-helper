[project]
name = "lfx-v1-sync-helper"
version = "0.1.1"
description = "LFX v1<>v2 data sync components"
requires-python = ">=3.12,<3.13"
dependencies = [
    "meltano[s3]==4.2.0",
]

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "mako>=1.4.2",
    "pip>=26.2.0",
    "urllib3>=2.8.0",
    "uv>=0.13.4",
    "virtualenv>=21.14.9",
]
