[project]
name = "lfx-v1-sync-helper"
version = "0.1.1"
description = "LFX v1<>v2 data sync components"
requires-python = ">=3.12,<3.13"
dependencies = [
    "meltano[s3]==4.2.0",
]

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "pip>=26.2.0",
    "urllib3>=2.8.0",
    "uv>=0.11.15",
    "virtualenv>=21.7.12",
]
